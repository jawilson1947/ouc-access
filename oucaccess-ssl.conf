<VirtualHost *:443>
    ServerName www.oucsda.org
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/pki/tls/certs/server.oucsda.org.crt
    SSLCertificateKeyFile /etc/pki/tls/private/localhost.key

    # Alias for serving images from Next.js app's public directory
    Alias "/images" "/home/jawilson/fullstack-app/public/images"
    
    # Directory configuration for images
    <Directory "/home/jawilson/fullstack-app/public/images">
        Require all granted
        Options Indexes FollowSymLinks
        AllowOverride None
        
        # Set proper MIME types for images
        <FilesMatch "\.(jpeg|jpg|png|gif|svg)$">
            Header set Cache-Control "public, max-age=14400"
        </FilesMatch>
    </Directory>

    ProxyPass "/access" "http://localhost:3000/access"
    ProxyPassReverse "/access" "http://localhost:3000/access"

    <Location "/access">
        ProxyPreserveHost On
        RequestHeader set X-Forwarded-Proto "https"
    </Location>

    ErrorLog /var/log/httpd/oucaccess-ssl-error.log
    CustomLog /var/log/httpd/oucaccess-ssl-access.log combined
</VirtualHost>

